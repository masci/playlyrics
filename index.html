<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayLyrics — Lyrics Worksheet Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>PlayLyrics</h1>
      <p class="subtitle">Generate a fill-in-the-blank lyrics worksheet with a QR code to the song.</p>
    </header>

    <form id="lyricsForm" novalidate>
      <div class="field">
        <label for="appleUrl">Apple Music URL</label>
        <div class="url-row">
          <input type="url" id="appleUrl" placeholder="https://music.apple.com/…" autocomplete="off" required>
          <button type="button" id="fetchBtn">
            <span id="fetchBtnText">Fetch Lyrics</span>
            <span id="fetchSpinner" class="spinner" hidden></span>
          </button>
        </div>
        <div id="fetchMsg" class="fetch-msg" hidden></div>
      </div>

      <div class="field">
        <label for="songTitle">Song title</label>
        <input type="text" id="songTitle" placeholder="e.g. Let It Be — The Beatles" autocomplete="off" required>
      </div>

      <div class="field">
        <label for="lyrics">Lyrics</label>
        <textarea id="lyrics" rows="14" placeholder="Paste the full song lyrics here…" required></textarea>
      </div>

      <div class="field">
        <label for="maskPct">
          Words to mask: <span id="pctLabel">30%</span>
        </label>
        <input type="range" id="maskPct" min="0" max="100" value="30">
        <div class="range-labels">
          <span>0%</span>
          <span>50%</span>
          <span>100%</span>
        </div>
      </div>

      <div id="errorMsg" class="error" hidden></div>

      <button type="submit" id="generateBtn">
        <span id="btnText">Generate PDF</span>
        <span id="btnSpinner" class="spinner" hidden></span>
      </button>
    </form>
  </div>

  <!-- Off-screen container for QR rendering -->
  <div id="qrContainer" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
